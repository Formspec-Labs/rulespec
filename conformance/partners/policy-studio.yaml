# WOS Studio (Authoring) — historical L3 + D3 disclosure and draft artifact hashes.
# Filed per source spec §10.3 + Appendix E. Studio is the first Rulespec
# reference consumer; this disclosure pairs with the in-tree L3 report at
# policy-studio/conformance-reports/L3-report.json.

partner:
  name:    "WOS Studio (Authoring)"
  contact: "studio-maintainers@formspec.org"
  website: "https://github.com/formspec/policy-studio"
  registry_endpoint: null

declaration:
  rkaf_version:           "0.2.0-pre.6"
  adoption_depth:         "D3"
  # Historical declaration bound to the report below, not renewed by the current
  # SNAP draft or native replay. Full Rulespec qualification of the revised source
  # remains unestablished; Studio-profile validation covers a different scope.
  conformance_level:      "L3"
  fixture_suite_version:  "0.2.0-pre.6"
  test_report_url:        "policy-studio/conformance-reports/L3-report.json"

# Studio implements validate on workspace.jsonld; profile derive lives in policy-studio.
projectors_implemented:
  - target: "json-schema"
    operations: ["validate"]
    carrier_convention_version: "0.2.0"

profile:
  name:                    "Studio profile"
  url:                     "policy-studio/profiles/studio/"
  base_vocabulary_version: "rkaf-core/0.2.0-pre.6"

anchoring_bindings:
  - binding_uri:      "urn:rkaf:anchor:trellis/1"
    binding_spec_url: "trellis/specs/trellis-core.md#section-6-7"

registry_trust: []

partner_participation:
  voice:                  true
  experience_reporting:   true
  profile_publication:    true
  federation_participation: true

# Current deterministic draft inspection artifacts. These identify compiled bytes;
# they do not prove execution, publication approval, or current L3/D3 conformance.
# The prior disclosure and export hash remain verbatim in the source history.
cutover_evidence:
  snap_evidence_scope: "draft-inspection"
  snap_historical_disclosure: "policy-studio/examples/snap-redetermination-from-sources/source-history/policy-studio-partner-before-native-replay.yaml"
  snap_baseline_sha256_compile_manifest: "6844356ea6db2bb4df5ae0667ba9faf09173ad1b901a6e74696b59b7e86aaa8e"
  snap_baseline_sha256_scenarios: "d10c1567fc29e6a80c0ec327e618b4183ee37ef02f726d066b4d0889345ffd0e"
  snap_baseline_sha256_wos_workflow: "5eb0ed4a2d9aa7f2080c04989400db9deed9751217eb2ab3490fa91f5b39db86"
  snap_baseline_sha256_compile_events: "f1e31eb5a16abb7a5dc93f001c77d189dce02aef4fde6546eeb00bb15576c018"
  snap_cutover_projection_golden: "policy-studio/snap-golden/SHA256SUMS"
