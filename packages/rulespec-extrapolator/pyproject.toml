[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rulespec-extrapolator"
version = "0.1.0.dev0"
description = "Experimental local document understanding and evidence-backed review."
readme = "README.md"
license = { text = "See the Rulespec repository LICENSE and LICENSE-CODE files" }
requires-python = ">=3.12"
dependencies = [
  "rulespec-projection>=0.1.0",
  "rulespec-conformance>=0.2.0rc18",
  "jsonschema==4.26.0",
  "pyshacl==0.31.0",
  "langextract==1.6.0",
  "python-dotenv>=1,<2",
]

[project.scripts]
rulespec-understand = "rulespec_extrapolator.cli:main"

[project.optional-dependencies]
references = ["spicysearch==0.1.4", "refspec==0.1.0.dev0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rulespec_extrapolator"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "rulespec_extrapolator/_data/LICENSE"
"../../LICENSE-CODE" = "rulespec_extrapolator/_data/LICENSE-CODE"
